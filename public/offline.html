<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Sampolio</title>
    <script>
      try {
        const theme = localStorage.getItem('sampolio-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch (_) { /* The system color scheme remains the fallback. */ }
    </script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        background: #f3f6f4; color: #1a211d;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1412; color: #e7ece9; }
      }
      [data-theme="light"] body { background: #f3f6f4; color: #1a211d; }
      [data-theme="dark"] body { background: #0f1412; color: #e7ece9; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-size: 1.4rem; margin: 0; }
      p { margin: 0; max-width: 22rem; line-height: 1.5; opacity: 0.8; }
      button {
        margin-top: 0.5rem; min-height: 44px; padding: 0.65rem 1.5rem; font: inherit; cursor: pointer;
        border: none; border-radius: 999px; background: #2f6b4f; color: #fff;
      }
      button:focus-visible { outline: 3px solid #47876a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Sampolio" />
    <h1>You're offline</h1>
    <p>Sampolio needs a connection to load your financial data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
